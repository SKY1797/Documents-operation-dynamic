<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Documents Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Operation Documents Portal</h1>
        <p>Access Schematic Diagrams and LMIs</p>
    </header>

    <main>
        <section class="category-grid">
            <button class="category-btn" onclick="filterDocs('turbine')">Turbine Diagrams</button>
            <button class="category-btn" onclick="filterDocs('boiler')">Boiler Diagrams</button>
            <button class="category-btn" onclick="filterDocs('offsite')">Offsite Diagrams</button>
            <button class="category-btn" onclick="filterDocs('electrical')">Electrical Diagrams</button>
            <button class="category-btn lmi-btn" onclick="filterDocs('Operation LMI')">Operation LMIs</button>
            <button class="category-btn reset-btn" onclick="filterDocs('all')">View All</button>
        </section>

        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search by document name...">
        </section>

        <section class="document-list" id="documentList">
            <p id="loadingMessage">Scanning Google Drive folders...</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
