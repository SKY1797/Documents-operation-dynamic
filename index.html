<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Operation Documents Portal</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="app-header" id="main-header">
        <div class="header-content">
            <div class="title-container">
                <h1>Operation Documents Portal</h1>
            </div>
        </div>
    </header>

    <hr class="section-divider" id="main-divider" style="max-width: 1200px; margin: 0 auto;">

    <main id="app-container">
    </main>

    <div id="docModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Document Viewer</span>
                <span class="close-btn" onclick="closeDocument()">✕</span>
            </div>
            <iframe id="docViewer" src="" width="100%" height="100%" frameborder="0"></iframe>
        </div>
    </div>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker registered successfully.', reg))
                    .catch(err => console.error('Service Worker registration failed.', err));
            });
        }
    </script>

</body>

</html>
